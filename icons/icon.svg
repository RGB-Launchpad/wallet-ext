<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dark ground so the mark holds up on both light and dark toolbars -->
  <rect width="128" height="128" rx="30" fill="#141414"/>
  <!-- Three additive circles: the protocol's name, and still readable at 16px.
       Kept small with clear gaps to the edge, otherwise they blur into one blob when scaled down. -->
  <g>
    <circle cx="64" cy="50" r="21" fill="#ff4d4d"/>
    <circle cx="50" cy="76" r="21" fill="#33d17a" fill-opacity="0.94"/>
    <circle cx="78" cy="76" r="21" fill="#4c8dff" fill-opacity="0.9"/>
  </g>
</svg>
